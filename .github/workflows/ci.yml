name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Structural check of pack-rip.html (must end with CHECK OK)
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build the React app
        run: npm run build
